kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: antrea-ui
  labels:
    app: antrea-ui
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - watch
      - list
    resourceNames:
      - antrea-config
      - antrea-ca
  # /featuregates is served by antrea-controller itself (see the GetFeatureGates handler), which
  # authorizes the request using antrea-ui's own identity, not the impersonated antrea-ui-admin
  # ServiceAccount, so the permission belongs here rather than on antrea-ui-admin.
  - nonResourceURLs:
      - /featuregates
    verbs:
      - get
---
# antrea-ui-admin holds every permission needed to serve K8s API requests made on behalf of the
# UI user (as opposed to antrea-ui's own operations, see the antrea-ui ClusterRole above), e.g.
# the K8s API proxy and Traceflow CRUD. antrea-ui impersonates this ServiceAccount for those
# requests (see role.yaml). This ClusterRole only aggregates rules from other ClusterRoles (see
# antrea-ui-admin-base below and rbac.antrea.io/aggregate-to-antrea-ui-admin: "true"); it must not
# carry its own rules, as the aggregation controller overwrites .rules on every reconcile and
# would silently drop them.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: antrea-ui-admin
  labels:
    app: antrea-ui
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.antrea.io/aggregate-to-antrea-ui-admin: "true"
rules: []
---
# antrea-ui-admin-base carries antrea-ui's own default rules for antrea-ui-admin. It is kept
# separate from antrea-ui-admin itself so that the aggregation controller (which overwrites
# antrea-ui-admin's .rules field on every reconcile) does not wipe them out.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: antrea-ui-admin-base
  labels:
    app: antrea-ui
    rbac.antrea.io/aggregate-to-antrea-ui-admin: "true"
rules:
  - apiGroups:
      - crd.antrea.io
    resources:
      - antreacontrollerinfos
    verbs:
      - get
  - apiGroups:
      - crd.antrea.io
    resources:
      - antreaagentinfos
    verbs:
      - list
      - get
  - apiGroups:
      - crd.antrea.io
    resources:
      - traceflows
      - traceflows/status
    verbs:
      - get
      - list
      - watch
      - create
      - delete
