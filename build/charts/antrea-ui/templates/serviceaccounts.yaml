apiVersion: v1
kind: ServiceAccount
metadata:
  name: antrea-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: antrea-ui
---
# antrea-ui-admin is never mounted by any Pod. antrea-ui impersonates it (via RBAC, see role.yaml)
# to make K8s API calls on behalf of the UI user, so that permissions needed for those calls (see
# clusterroles.yaml) can be granted without also exposing antrea-ui's own sensitive access (e.g.
# to the antrea-ui-passwd Secret). When flowAggregator.enabled, antrea-ui also mints real,
# short-lived tokens for this ServiceAccount (via the TokenRequest API, see role.yaml's
# serviceaccounts/token rule) and presents them to the Flow Aggregator's FlowStreamService, which
# does not support impersonation: this account's credential exposure is not limited to
# impersonation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: antrea-ui-admin
  namespace: {{ .Release.Namespace }}
  labels:
    app: antrea-ui
