apiVersion: v1
kind: ServiceAccount
metadata:
  name: antrea-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: antrea-ui
---
# antrea-ui-admin is never mounted by any Pod. antrea-ui impersonates it (via RBAC, see role.yaml)
# to make K8s API calls on behalf of the UI user, so that permissions needed for those calls (see
# clusterroles.yaml) can be granted without also exposing antrea-ui's own sensitive access (e.g.
# to the antrea-ui-passwd Secret). When both flowAggregator.enabled and auth.basic.enable are set,
# antrea-ui also mints real, short-lived tokens for this ServiceAccount (via the TokenRequest API,
# see role.yaml's serviceaccounts/token rule) and presents them to the Flow Aggregator's
# FlowStreamService, which does not support impersonation: this account's credential exposure is
# not limited to impersonation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: antrea-ui-admin
  namespace: {{ .Release.Namespace }}
  labels:
    app: antrea-ui
{{- if .Values.metrics.enabled }}
---
# antrea-ui-metrics-scraper is never mounted by any Pod either. antrea-ui mints short-lived tokens
# for it (see role.yaml's serviceaccounts/token rule) and presents them to the targets it scrapes
# for live metrics taps. It is a separate account, bound to nothing but read access to /metrics
# (see clusterroles.yaml), because an Antrea Agent is reached at an address and verified against a
# CA which any agent can rewrite: a token sent there must be worth as little as possible. See
# docs/metrics.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: antrea-ui-metrics-scraper
  namespace: {{ .Release.Namespace }}
  labels:
    app: antrea-ui
{{- end }}
