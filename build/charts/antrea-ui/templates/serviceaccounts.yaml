apiVersion: v1
kind: ServiceAccount
metadata:
  name: antrea-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: antrea-ui
---
# antrea-ui-admin is never mounted by any Pod. antrea-ui impersonates it (via RBAC, see role.yaml)
# to make K8s API calls on behalf of the UI user, so that permissions needed for those calls can
# be granted (including by plugins, via ClusterRole aggregation, see clusterrole.yaml) without
# also exposing antrea-ui's own sensitive access (e.g. to the antrea-ui-passwd Secret).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: antrea-ui-admin
  namespace: {{ .Release.Namespace }}
  labels:
    app: antrea-ui
