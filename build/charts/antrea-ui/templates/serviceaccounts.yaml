apiVersion: v1
kind: ServiceAccount
metadata:
  name: antrea-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: antrea-ui
---
# antrea-ui-admin is never mounted by any Pod. antrea-ui impersonates it (via RBAC, see role.yaml)
# to make K8s API calls on behalf of the UI user, so that permissions needed for those calls (see
# clusterroles.yaml) can be granted without also exposing antrea-ui's own sensitive access (e.g.
# to the antrea-ui-passwd Secret). Support bundles are also collected as this ServiceAccount,
# whoever requested them. antrea-ui also mints real, short-lived tokens for this ServiceAccount
# (via the TokenRequest API, see role.yaml's serviceaccounts/token rule), to present to services
# that do not support impersonation: the Flow Aggregator, when auth.basic.enable and
# flowAggregator.enabled are both set, and support bundle sources reached by URL
# (supportBundle.extraSources[].https). This account's credential exposure is not limited to
# impersonation. Tokens for a support bundle source carry that source's own audience, which the
# apiserver rejects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: antrea-ui-admin
  namespace: {{ .Release.Namespace }}
  labels:
    app: antrea-ui
