kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: antrea-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: antrea-ui
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "antrea-ui-passwd"
    verbs:
      - "get"
      - "update"
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "create"
  - apiGroups:
      - ""
    resources:
      - "serviceaccounts"
    resourceNames:
      - "antrea-ui-admin"
    verbs:
      - "impersonate"
  # Lets antrea-ui mint real, short-lived tokens for antrea-ui-admin (see serviceaccounts.yaml),
  # to present to services that do not support impersonation:
  # - the Flow Aggregator's FlowStreamService, for admin-password sessions
  #   (session.KindImpersonate), the one login mode with no bearer token or client cert of its
  #   own.
  # - support bundle sources reached by URL, which are always called as antrea-ui-admin. Those
  #   tokens are minted with an audience of the source's own, which the apiserver rejects.
  # antrea-ui can already act as antrea-ui-admin through the impersonation rule above, so this
  # adds no new access. RBAC cannot limit the audience or lifetime of the tokens minted, though:
  # a holder of antrea-ui's credential could mint antrea-ui-admin tokens that outlive it (deleting
  # the antrea-ui-admin ServiceAccount revokes them). The grant does not depend on which features
  # are enabled, which keeps this Role the same whatever the configuration.
  - apiGroups:
      - ""
    resources:
      - "serviceaccounts/token"
    resourceNames:
      - "antrea-ui-admin"
    verbs:
      - "create"
