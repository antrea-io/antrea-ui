kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: antrea-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: antrea-ui
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "antrea-ui-passwd"
    verbs:
      - "get"
      - "update"
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "create"
  - apiGroups:
      - ""
    resources:
      - "serviceaccounts"
    resourceNames:
      - "antrea-ui-admin"
    verbs:
      - "impersonate"
{{- if .Values.flowAggregator.enabled }}
  # Lets antrea-ui mint a real, short-lived token for antrea-ui-admin and present it to the Flow
  # Aggregator's FlowStreamService, which does not support impersonation (see
  # serviceaccounts.yaml).
  - apiGroups:
      - ""
    resources:
      - "serviceaccounts/token"
    resourceNames:
      - "antrea-ui-admin"
    verbs:
      - "create"
{{- end }}
