kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: antrea-ui
  labels:
    app: antrea-ui
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - watch
      - list
    resourceNames:
      - antrea-config
      - antrea-ca
  # Namespace discovery for GET /api/v1/access-summary: Kubernetes has no self-service API for
  # "which namespaces can I see", so antrea-ui watches RoleBindings and reports the ones naming the
  # user as a subject. This is a cluster-wide read of RBAC topology; it is the only privileged read
  # antrea-ui performs on the user's behalf.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - list
      - watch
---
# antrea-ui-admin holds every permission needed to serve K8s API requests made on behalf of the
# UI user (as opposed to antrea-ui's own operations, see the antrea-ui ClusterRole above), e.g.
# the K8s API proxy and Traceflow CRUD. antrea-ui impersonates this ServiceAccount for those
# requests (see role.yaml).
#
# Aggregated ClusterRole (https://kubernetes.io/docs/reference/access-authn-authz/rbac/#aggregated-clusterroles):
# its `rules` are populated automatically by the API server from every ClusterRole labeled
# rbac.ui.antrea.io/aggregate-to-antrea-ui-admin: "true", including antrea-ui-admin-core below.
# Plugins that need additional RBAC ship their own similarly-labeled ClusterRole instead of
# editing this file — that ClusterRole's creation is the responsibility of whoever deploys the
# plugin.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: antrea-ui-admin
  labels:
    app: antrea-ui
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.ui.antrea.io/aggregate-to-antrea-ui-admin: "true"
# No `rules` here: the aggregation controller owns and populates this field itself. Setting it
# explicitly (even to []) makes Helm's server-side apply fight the controller for ownership of
# .rules on every upgrade ("conflict with clusterrole-aggregation-controller").
---
# antrea-ui-admin-core is the base of that aggregation: exactly the permissions the UI's own pages
# need, and nothing else. Unlike antrea-ui-admin, its rule list is static — it changes only when
# this chart is upgraded — which makes it the sane model for a role of your own to bind to users
# logging in with their own Kubernetes identity (OIDC, kubeconfig, token). See
# docs/authentication.md; the trade-off is that such users do not pick up plugin permissions from
# the aggregation and need those granted separately.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: antrea-ui-admin-core
  labels:
    app: antrea-ui
    rbac.ui.antrea.io/aggregate-to-antrea-ui-admin: "true"
rules:
  - apiGroups:
      - crd.antrea.io
    resources:
      - antreacontrollerinfos
    verbs:
      - get
  - apiGroups:
      - crd.antrea.io
    resources:
      - antreaagentinfos
    verbs:
      - list
      - get
  - apiGroups:
      - crd.antrea.io
    resources:
      - traceflows
      - traceflows/status
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - nonResourceURLs:
      - /featuregates
    verbs:
      - get
  # Namespaces are useful to the UI in their own right — filter menus and pickers are the obvious
  # consumers — and granting the rule here also lets GET /api/v1/access-summary answer
  # namespaces: ["*"] directly, from a SelfSubjectAccessReview, instead of falling back to its
  # RoleBinding scan. That scan cannot see a ClusterRoleBinding, so without this rule a user bound
  # to this role cluster-wide is reported as having no accessible namespaces at all. If you model
  # a role of your own on this one, keep this rule for the same reason.
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - list
{{- if and .Values.flowAggregator.enabled .Values.auth.basic.enable }}
---
# Flow visibility for admin-password sessions. The Flow Aggregator's FlowStreamService authorizes
# with Kubernetes RBAC against a virtual resource and does not support impersonation, so antrea-ui
# mints a real antrea-ui-admin token for it (see role.yaml's serviceaccounts/token rule) — meaning
# the ServiceAccount itself, not the impersonating caller, must hold these rules.
#
# Granted cluster-wide, deliberately: the built-in admin is the break-glass operator account, and
# cluster_wide is the only FlowStreamService scope in which nothing is redacted. A cluster-wide
# grant also covers a named-Namespace scope, so an admin who selects a single Namespace still gets
# every endpoint at the Full tier rather than seeing their own peers redacted.
#
# These rules duplicate the flow-aggregator chart's antrea-flow-viewer and
# antrea-flow-identity-viewer rather than binding to them: those are gated behind
# flowStreamService.installClusterRoles (default false) and may not exist, and their aggregation
# labels cannot be extended from here. Keep them in sync with upstream.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: antrea-ui-admin-flows
  labels:
    app: antrea-ui
    rbac.ui.antrea.io/aggregate-to-antrea-ui-admin: "true"
rules:
  - apiGroups: ["observability.antrea.io"]
    resources: ["flows"]
    # watch, not just list: the SSE stream always sets Follow, and upstream grants list alone as
    # history-only access.
    verbs: ["list", "watch"]
  - apiGroups: ["observability.antrea.io"]
    resources: ["flows/identity"]
    verbs: ["get"]
{{- end }}
