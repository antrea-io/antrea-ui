kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: antrea-ui
  labels:
    app: antrea-ui
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - watch
      - list
    resourceNames:
      - antrea-config
      - antrea-ca
---
# antrea-ui-admin holds every permission needed to serve K8s API requests made on behalf of the
# UI user (as opposed to antrea-ui's own operations, see the antrea-ui ClusterRole above), e.g.
# the K8s API proxy and Traceflow CRUD. antrea-ui impersonates this ServiceAccount for those
# requests (see role.yaml). A follow-up PR will let plugins extend these permissions via
# ClusterRole aggregation.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: antrea-ui-admin
  labels:
    app: antrea-ui
rules:
  - apiGroups:
      - crd.antrea.io
    resources:
      - antreacontrollerinfos
    verbs:
      - get
  - apiGroups:
      - crd.antrea.io
    resources:
      - antreaagentinfos
    verbs:
      - list
      - get
  - apiGroups:
      - crd.antrea.io
    resources:
      - traceflows
      - traceflows/status
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
  - nonResourceURLs:
      - /featuregates
    verbs:
      - get
