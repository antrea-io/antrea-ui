{{- /* Opt-in discovery of a flow source's Service (discovery.enabled on a flowSources entry) reads
Services in every namespace and the CA ConfigMap in the namespace of the Service it finds, which is
not known in advance, and the backend watches that ConfigMap, so the grant is get, list and watch.
One ClusterRole serves every discovering source: it is limited to the CA names those sources
configure, and left out for a source which skips TLS verification. Static sources keep their
namespaced CA access. */ -}}
{{- $discovering := list }}
{{- range (include "antrea-ui.flowSources" . | fromYamlArray) }}
{{- if dig "discovery" "enabled" false . }}
{{- $discovering = append $discovering . }}
{{- end }}
{{- end }}
{{- if $discovering }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-flow-source-discovery
  labels:
    app: antrea-ui
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list", "watch"]
{{- $caNames := list }}
{{- range $discovering }}
{{- if and .caConfigMap (not .insecureSkipVerify) }}
{{- $caNames = append $caNames .caConfigMap }}
{{- end }}
{{- end }}
{{- if $caNames }}
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: {{ $caNames | uniq | toJson }}
    verbs: ["get", "list", "watch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-flow-source-discovery
  labels:
    app: antrea-ui
subjects:
  - kind: ServiceAccount
    name: antrea-ui
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-flow-source-discovery
  apiGroup: rbac.authorization.k8s.io
{{- end }}
