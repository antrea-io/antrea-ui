{{- /* Each flowSources entry with a caConfigMap and TLS verification gets get/list/watch access in its own
namespace: the backend watches the CA of a source through the Kubernetes API, and the CA can live in
another namespace. The names carry the entry's index so that two entries in one namespace do not
collide. The Flow Aggregator's own CA is covered by flow-aggregator-rbac.yaml. */ -}}
{{- range $i, $source := .Values.flowSources }}
{{- if and $source.caConfigMap (not $source.insecureSkipVerify) }}
{{- if not $source.namespace }}
{{- fail (printf "flowSources[%d].namespace is required when caConfigMap is set" $i) }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-flow-source-{{ $i }}-ca-reader
  namespace: {{ $source.namespace | quote }}
  labels:
    app: antrea-ui
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $source.caConfigMap | quote }}]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-flow-source-{{ $i }}-ca-reader
  namespace: {{ $source.namespace | quote }}
  labels:
    app: antrea-ui
subjects:
  - kind: ServiceAccount
    name: antrea-ui
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $.Release.Name }}-flow-source-{{ $i }}-ca-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
