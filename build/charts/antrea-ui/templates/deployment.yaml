apiVersion: apps/v1
kind: Deployment
metadata:
  name: antrea-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: antrea-ui
spec:
  # Must stay 1: sessions (and the Kubernetes credentials they hold) live in the backend's
  # memory only, so a second replica would reject cookies issued by the first.
  replicas: 1
  selector:
    matchLabels:
      app: antrea-ui
  template:
    metadata:
      labels:
        app: antrea-ui
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        kubectl.kubernetes.io/default-container: frontend
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: antrea-ui
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | trim | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: frontend
          image: {{ include "frontendImage" . | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          env:
            - name: NGINX_RELOADER_DIRECTORIES
              {{- if .Values.https.enable }}
              value: "/app/ssl"
              {{- else }}
              value: ""
              {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
              {{- if .Values.https.enable }}
              scheme: HTTPS
              {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
              {{- if .Values.https.enable }}
              scheme: HTTPS
              {{- end }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            {{- if .Values.https.enable }}
            - name: nginx-tls
              mountPath: /app/ssl
              readOnly: true
            {{- end }}
            {{- with .Values.frontend.extraVolumeMounts }}
            {{- toYaml . | trim | nindent 12 }}
            {{- end }}
        - name: backend
          image: {{ include "backendImage" . | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          args:
            - "-c"
            - "/app/server-conf.yaml"
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.auth.oidc.enable }}
            - name: ANTREA_UI_AUTH_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "oidcClientIDSecretName" . }}
                  key: {{ include "oidcClientIDKey" . }}
            - name: ANTREA_UI_AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "oidcClientSecretSecretName" . }}
                  key: {{ include "oidcClientSecretKey" . }}
            {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: server-conf
              mountPath: /app/server-conf.yaml
              subPath: server.conf
              readOnly: true
            {{- with .Values.backend.extraVolumeMounts }}
            {{- toYaml . | trim | nindent 12 }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: nginx-conf
          configMap:
            name: antrea-ui-nginx
        - name: server-conf
          configMap:
            name: antrea-ui-backend
        {{- if .Values.https.enable }}
        {{- $secretName := "antrea-ui-tls-helm" }}
        {{- if eq .Values.https.method "secret" }}
        {{- $secretName = .Values.https.secret.secretName }}
        {{- end }}
        - name: nginx-tls
          secret:
            secretName: {{ $secretName }}
            defaultMode: 0400
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | trim | nindent 8 }}
        {{- end }}
      terminationGracePeriodSeconds: 10
