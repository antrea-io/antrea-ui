# Configuration for the Antrea UI frontend container.
frontend:
  # -- Container image to use for the Antrea UI frontend.
  image:
    repository: "antrea/antrea-ui-frontend"
    pullPolicy: "IfNotPresent"
    tag: ""
  # -- Container port on which the frontend will listen.
  port: 3000
  # -- Resource requests and limits for the frontend container.
  resources: {}
  # -- Additional volumeMounts.
  extraVolumeMounts: []

# Configuration for the Antrea UI backend container.
backend:
  # -- Container image to use for the Antrea UI backend.
  image:
    repository: "antrea/antrea-ui-backend"
    pullPolicy: "IfNotPresent"
    tag: ""
  # -- Container port on which the backend will listen.
  port: 8080
  # -- Resource requests and limits for the backend container.
  resources: {}
  # -- Log verbosity switch for backend server.
  logVerbosity: 0
  # -- Additional volumeMounts.
  extraVolumeMounts: []

# -- Address at which the Antrea UI is accessible. Not required for most configurations.
url: ""

# -- Namespace where Antrea is installed.
antreaNamespace: "kube-system"

# Frontend plugins (see docs/plugins.md): delivered as labeled ConfigMaps that the backend
# watches.
plugins:
  # -- Label selector for the ConfigMaps (in the namespace below) that the backend watches for
  # frontend plugins.
  labelSelector: "ui.antrea.io/plugin=true"
  # -- Namespace to watch for plugin ConfigMaps. Defaults to the release namespace. Set this to
  # isolate plugin ConfigMaps away from antrea-ui's own release namespace - useful since
  # antrea-ui is commonly installed into kube-system, which can host other sensitive ConfigMaps.
  # If set to anything other than the release namespace, whoever runs `helm install`/`upgrade`
  # needs permission to create a Role/RoleBinding in that other namespace too.
  namespace: ""
  # -- Caps how many distinct ConfigMap-backed plugins the backend tracks at once. A new plugin
  # past this limit is rejected and logged; updates to an already-tracked one are never blocked
  # by it. 0 means unbounded.
  maxConfigMapPlugins: 10
  # -- Same as maxConfigMapPlugins, but for the backend's optional filesystem-directory plugin
  # source (see docs/plugins.md) - not itself exposed as a chart value, since how a deployment
  # would deliver a shared plugin directory to the backend Pod isn't settled yet.
  maxDirectoryPlugins: 10
  # -- Caps how many bytes a single ConfigMap-backed plugin's bundle.zip may decompress to in
  # total. A ConfigMap's own ~1MiB etcd size limit only bounds the compressed bytes, not what
  # they decompress to, so this is what actually protects the backend from a maliciously
  # high-ratio archive ("zip bomb") exhausting its memory. 0 means unbounded.
  maxConfigMapBundleBytes: 5242880

# Flow Aggregator gRPC integration (live flow visibility in the UI).
flowAggregator:
  # -- When true, the backend connects to Flow Aggregator's FlowStreamService over gRPC.
  enabled: false
  # -- gRPC address (host:port) of the FlowStreamService.
  address: "flow-aggregator.flow-aggregator.svc:14740"
  # -- Name of the ConfigMap (in namespace below) containing the CA certificate (key: ca.crt)
  # used to verify the FlowStreamService server certificate.
  # The FlowStreamService uses server-side TLS only (no client authentication).
  # Leave empty to skip server certificate verification (dev/test only).
  caConfigMap: flow-aggregator-ca
  # -- Namespace where the Flow Aggregator is installed.
  namespace: flow-aggregator
  # -- Override the TLS server name used for certificate verification. Useful when dialing
  # via kubectl port-forward (loopback address) while the server cert is issued for the
  # in-cluster Service DNS name (e.g. flow-aggregator.flow-aggregator.svc).
  # Leave empty to use the hostname from the address field.
  serverName: ""
  # -- Disable TLS server certificate verification. Should only be used for development
  # or testing; never enable this in production.
  insecureSkipVerify: false

security:
  # -- (bool) Set the Secure attribute for Antrea UI cookies. The attribute is set by default when HTTPS is
  # enabled in Antrea UI (by setting https.enable to true). When using an Ingress to terminate TLS,
  # you should explicitly set cookieSecure to true for security hardening purposes.
  # @default -- same as https.enable
  cookieSecure:

# HTTPS configuration for the Antrea UI.
https:
  # -- Enable HTTPS (only) for accessing the web UI. When using an Ingress to terminate TLS, you do
  # not need to enable HTTPS here.
  enable: false
  # -- Method for generating the TLS certificate for the web server. We support "auto", "user",
  # "userCA", and "secret". With "auto", Helm will generate a new self-signed certificate every time
  # the template function is executed. With "user", the user is responsible for providing a
  # certificate and key, which will be used directly. With "userCA", the user is responsible for
  # providing a CA certificate and key, which will be used to generate a signed certificate to be
  # used by the web server. With "secret", the user is responsible for providing a secret of type
  # kubernetes.io/tls, in the Namespace of the release. The secret must include the tls.crt and
  # tls.key data fields.
  method: "auto"
  # -- Configure automatic TLS certificate generation with Helm.
  auto:
    # -- Common name to use in the certificate.
    commonName: "localhost"
    # -- IP addresses to use in the certificate.
    ipAddresses: []
    # -- DNS names to use in the certificate.
    dnsNames: []
    # -- Number of days for which the certificate will be valid. There is no automatic rotation with
    # this method.
    daysValid: 365
  # -- Use the provided TLS certificate and key.
  user:
    # -- Certificate (base64-encoded PEM format)
    cert: ""
    # -- Private key (base64-encoded PEM format)
    key: ""
  # -- Use the provided CA certificate and key to generate a signed certificate.
  userCA:
    # -- CA certificate (base64-encoded PEM format)
    cert: ""
    # -- CA private key (base64-encoded PEM format)
    key: ""
    # -- Common name to use in the certificate.
    commonName: "localhost"
    # -- IP addresses to use in the certificate.
    ipAddresses: []
    # -- DNS names to use in the certificate.
    dnsNames: []
    # -- Number of days for which the certificate will be valid. There is no automatic rotation with
    # this method.
    daysValid: 365
  secret:
    # -- Name of the secret containing the PEM data for the certificate and private key to
    # use. Secret must be of type kubernetes.io/tls. The typical use case is a secret generated by
    # cert-manager. The secret must exist in the Namespace of the Helm release (typically,
    # kube-system).
    secretName: "antrea-ui-tls"

# Authentication. The modes below are independent: enable any combination.
#
# Except for basic, every mode makes Antrea UI act as the *end user's* Kubernetes identity, so
# what a user can see and do is decided by that user's own RBAC. Grant them a role of your own,
# scoped to what they should be allowed to do (antrea-ui-admin-core's rules are a good starting
# point), or they will log in successfully and then get 403s everywhere. Note that the
# antrea-ui-admin ClusterRole is aggregated, so binding *it* to users hands them whatever any
# installed plugin adds to it, now and later. See docs/authentication.md.
auth:
  basic:
    # -- Enable password-based authentication (the static "admin" password). Kubernetes API calls
    # made by these sessions are impersonated as the antrea-ui-admin ServiceAccount, so every
    # user logging in this way has exactly the same cluster access.
    enable: true
  kubeconfig:
    # -- Enable "bring your own kubeconfig" authentication: the user uploads a kubeconfig and
    # Antrea UI uses the current context's credential (a token, or a client certificate and key)
    # on their behalf. Credentials that would have to run a program on the user's machine (exec
    # plugins, auth-provider) are rejected.
    enable: false
  serviceAccountToken:
    # -- Enable Kubernetes token authentication on the login page: the user pastes a bearer token
    # (typically a ServiceAccount token) and Antrea UI creates a session from it, like any other
    # login mode. Independent of auth.bearerToken below, which accepts the same credential as a
    # per-request API header rather than as a login.
    enable: true
  bearerToken:
    # -- Enable the "Authorization: Bearer <token>" fallback on the Antrea UI API, for non-browser
    # clients (a script, a controller, the e2e suite) that authenticate every request with a
    # Kubernetes token instead of holding a session cookie. Such a request creates no session, and
    # its token is validated against the API server on the request itself, since there is no login
    # step to validate it at. The browser UI never sends this header, so turning it off costs the
    # UI nothing; leave it on only if something other than a browser talks to the API.
    enable: true
  oidc:
    # -- Enable OIDC-based authentication: the server connects to an OIDC provider to authenticate
    # users. When enabling OIDC authentication, you will need to set the top-level url value. The
    # kube-apiserver must be configured to trust the *same* issuer, via the --oidc-issuer-url
    # and --oidc-client-id flags, because the id_token is what Antrea UI presents to it on the
    # user's behalf. See docs/oidc.md.
    enable: false
    # -- Scopes to request from the OIDC provider. "offline_access" is what makes the provider
    # issue a refresh token, without which a session ends as soon as the id_token does (often
    # only minutes). "groups" populates the group claims that group-based Kubernetes RBAC needs.
    # "email" is requested because --oidc-username-claim=email is by far the most common
    # kube-apiserver configuration, and providers omit the claim if the scope was not asked for.
    scopes:
      - openid
      - email
      - groups
      - offline_access
    # -- Name of the OIDC provider (Dex, Github OAuth2, ...). This is used for user-facing messages,
    # and does not have any impact on functionality.
    providerName: ""
    # -- URL of the OIDC provider. The server will use the URL to retrieve the OpenID Provider
    # Configuration Document, which should be available at the /.well-known/openid-configuration
    # endpoint. The kube-apiserver must be configured to trust this same issuer, since the id_token
    # it issues is the credential Antrea UI presents to Kubernetes on the user's behalf.
    issuerURL: ""
    # -- Address at which to perform OIDC discovery, when it differs from issuerURL. Only needed
    # when the issuer is a public address the backend Pod cannot reach (or cannot reach until it is
    # itself Ready, which would deadlock startup). Leave empty to discover at issuerURL, which is
    # the normal case.
    discoveryURL: ""
    # -- Application (client) ID to be used by the Antrea UI server to identify itself to the OIDC
    # provider.
    clientID: ""
    clientIDSecretRef:
      # -- Name of the secret containing the application (client) ID to be used by the Antrea UI
      # server to identify itself to the OIDC provider. The secret must exist in the Namespace of
      # the Helm release. It is mutually exclusive with the clientID value.
      name: ""
      # -- Name of the key field storing the application (client) ID in the referenced secret.
      key: "clientID"
    # -- Application secret to be used by the Antrea UI server to identify itself to the OIDC
    # provider. Note that this secret will never be exposed to the UI frontend and to users. It
    # should be base64-encoded.
    clientSecret: ""
    clientSecretSecretRef:
      # -- Name of the secret containing the application secret to be used by the Antrea UI
      # server to identify itself to the OIDC provider. The secret must exist in the Namespace of
      # the Helm release. It is mutually exclusive with the clientSecret value.
      name: ""
      # -- Name of the key field storing the application secret in the referenced secret.
      key: "clientSecret"
    # -- URL to log out of the OIDC provider. It will be invoked when the user logs out of the
    # Antrea UI. Some OIDC providers may not offer this capability. If this is empty, the user will
    # stay signed into the identity provider even after logging out of the Antrea UI. The provided
    # URL will be processed by a template engine, and the following template values are supported:
    # {{Token}} (the ID token issued by the provider), {{ClientID}} (the application ID), {{URL}}
    # (the URL at which Antrea UI is accessible), and {{LogoutReturnURL}} (useful if you want to
    # redirect back to Antrea UI after signing out from the identity provider, with a helpful
    # user-facing message).
    logoutURL: ""

# Server-side sessions. A session holds the user's Kubernetes credential, in the backend's
# memory only: nothing is written to a Secret, a ConfigMap, or a volume, and a Pod restart logs
# everyone out.
session:
  # -- How long a session survives with no request. The UI pings the backend every 5 minutes
  # while a tab is visible, so this is really "how long with no open visible tab".
  idleTimeout: 30m
  # -- Absolute cap on a session's lifetime, however active the user is.
  maxLifetime: 12h
  # -- Maximum number of concurrent sessions the backend will hold.
  maxSessions: 1000
  # -- Maximum number of concurrent sessions one identity may hold. This is what keeps a single
  # user from filling maxSessions and denying logins to everyone else. Logging in past the cap
  # evicts that user's own least-recently-used session rather than failing the login. Must be
  # <= maxSessions. Admin-password sessions are exempt: they all authenticate as the same
  # "admin", so capping them would give every user of that password one shared budget.
  maxSessionsPerUser: 10

# IPv6 configuration for the Antrea UI.
ipv6:
  # -- Enable IPv6 for accessing the web UI. Even if the cluster does not support IPv6, you do not
  # typically need to set this value to false.
  enable: true

# Configuration for the Antrea UI Service.
service:
  # --- The type of Service used for Antrea UI access, either ClusterIP, NodePort or LoadBalancer.
  type: ClusterIP
  # -- The port on which the Service is exposed.
  port: 3000
  # --- The Node port to use when the Service type is NodePort or LoadBalancer.
  nodePort: 31234
  # -- Annotations to be added to the Service.
  annotations: {}
  # -- Labels to be added to the Service.
  labels: {}
  # -- Override the ExternalTrafficPolicy for the Service. Set it to Local to route Service traffic
  # to Node-local endpoints only.
  externalTrafficPolicy:

# -- Node selector for the Antrea UI Pod.
nodeSelector:
  kubernetes.io/os: linux

# -- Affinity for the Antrea UI Pod.
affinity: {}

# -- Tolerations for the Antrea UI Pod.
tolerations: {}

# -- Annotations to be added to the Antrea UI Pod.
podAnnotations: {}
# -- Labels to be added to the Antrea UI Pod.
podLabels: {}

# -- Additional volumes.
extraVolumes: []

# -- Additional entries for the Pod's /etc/hosts, in the standard PodSpec hostAliases form. Useful
# when the backend has to reach a name that cluster DNS cannot resolve - an OIDC issuer served
# outside the cluster, for example - without having to touch CoreDNS. Each entry is
# `{ip: <address>, hostnames: [<name>, ...]}`.
hostAliases: []
