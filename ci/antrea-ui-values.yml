# Values used to install Antrea UI for the e2e job. The point is to exercise non-default options,
# so that CI covers more than the out-of-the-box configuration.
#
# OIDC points at the Dex instance that ci/e2e-oidc.sh runs as a container alongside the Kind nodes.
# Dex is deliberately NOT in the cluster: Antrea UI presents the id_token to the kube-apiserver as
# the end user's own credential, so the apiserver has to trust the same issuer, and it has no route
# to a Pod-local Dex. See ci/e2e-oidc.sh for the full topology.
url: http://localhost:3000
auth:
  # Off by default, and required by TestLoginWithKubeconfig, which skips without it.
  kubeconfig:
    enable: true
  oidc:
    enable: true
    providerName: "Dex"
    # Byte-for-byte the issuer Dex advertises and the apiserver is configured with: it is the "iss"
    # claim all three parties compare. The backend Pod resolves this name through a hostAliases
    # entry, which the caller has to supply because the Dex container's IP is only known at runtime:
    #   helm install ... -f ci/antrea-ui-values.yml \
    #     --set hostAliases[0].ip="$(ci/e2e-oidc.sh dex-ip)" \
    #     --set hostAliases[0].hostnames[0]=dex.e2e
    issuerURL: "https://dex.e2e:5556/dex"
    clientID: "antrea-ui"
    # base64 of "antrea-ui-e2e-secret", matching OIDC_CLIENT_SECRET in ci/e2e-oidc.sh. Only ever
    # valid inside a throwaway test cluster.
    clientSecret: "YW50cmVhLXVpLWUyZS1zZWNyZXQ="
# Dex serves TLS with a certificate from a CA generated by ci/e2e-oidc.sh, which nothing trusts by
# default. The backend has to trust it for both OIDC discovery and the authorization-code exchange.
# Dropping the CA into /etc/ssl/certs is enough: Go reads every file in that directory in addition
# to the system bundle, and the distroless base image already has the directory.
extraVolumes:
  - name: dex-ca
    configMap:
      name: antrea-ui-e2e-dex-ca
backend:
  extraVolumeMounts:
    - name: dex-ca
      mountPath: /etc/ssl/certs/dex-ca.crt
      subPath: ca.crt
      readOnly: true
logVerbosity: 2
